# Synced from thaw-app/platform. Edit config/repos.yaml there.
version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    assignees:
      - "diazdesandi"
    open-pull-requests-limit: 10

updates:
  - package-ecosystem: "npm"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "dependencies"